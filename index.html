<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Love Heart Boot</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:black;
        overflow:hidden;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:monospace;
    }

    #bootText{
        position:absolute;
        color:#ff4d6d;
        font-size:28px;
        letter-spacing:3px;
        animation:fadeOut 3s forwards;
        text-shadow:0 0 10px #ff4d6d;
    }

    @keyframes fadeOut{
        0%{
            opacity:1;
        }
        80%{
            opacity:1;
        }
        100%{
            opacity:0;
            visibility:hidden;
        }
    }

    .heart{
        position:relative;
        width:500px;
        height:500px;
        opacity:0;
        animation:showHeart 3s forwards;
        animation-delay:3s;
    }

    @keyframes showHeart{
        from{
            opacity:0;
            transform:scale(0.8);
        }
        to{
            opacity:1;
            transform:scale(1);
        }
    }

    .word{
        position:absolute;
        color:#ff5c8a;
        font-size:18px;
        user-select:none;
        text-shadow:
            0 0 5px #ff5c8a,
            0 0 10px #ff5c8a,
            0 0 20px #ff0055;
        animation:glow 2s infinite alternate;
    }

    @keyframes glow{
        from{
            opacity:0.4;
            filter:brightness(1);
        }
        to{
            opacity:1;
            filter:brightness(2);
        }
    }

    .centerText{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        color:white;
        font-size:60px;
        font-weight:bold;
        text-shadow:
            0 0 10px white,
            0 0 20px #ff0055,
            0 0 40px #ff0055;
        opacity:0;
        animation:centerAppear 2s forwards;
        animation-delay:5s;
    }

    @keyframes centerAppear{
        from{
            opacity:0;
            transform:translate(-50%, -50%) scale(0.5);
        }
        to{
            opacity:1;
            transform:translate(-50%, -50%) scale(1);
        }
    }
</style>
</head>

<body>

<div id="bootText">INITIALIZE BOOT UP...</div>

<div class="heart" id="heart">
    <div class="centerText">Love you</div>
</div>

<script>
const heart = document.getElementById("heart");

function createHeartWords() {

    const total = 850;

    for(let i = 0; i < total; i++) {

        const t = Math.PI * 2 * Math.random();

        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t);

        const scale = 15;

        const word = document.createElement("div");
        word.className = "word";
        word.innerText = "i love you";

        word.style.left = (250 + x * scale) + "px";
        word.style.top = (250 - y * scale) + "px";

        word.style.opacity = "0";

        word.style.animationDelay = (Math.random() * 2) + "s";

        heart.appendChild(word);

        setTimeout(() => {
            word.style.transition = "1s";
            word.style.opacity = "1";
        }, 3000 + i * 8);
    }
}

createHeartWords();
</script>

</body>
</html>
